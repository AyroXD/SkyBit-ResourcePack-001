name: Build SkyBit Resource Pack

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_pack.py'
      - '.github/workflows/build-resource-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate resource pack
        run: python tools/generate_pack.py

      - name: Verify ZIP
        run: |
          python - <<'PY'
          import hashlib, zipfile
          p='SkyBit-ResourcePack-v3.2.0-READY.zip'
          with zipfile.ZipFile(p) as z:
              assert 'pack.mcmeta' in z.namelist()
              assert 'pack.png' in z.namelist()
              assert z.testzip() is None
          sha=hashlib.sha1(open(p,'rb').read()).hexdigest()
          print('ZIP OK')
          print('SHA1:', sha)
          PY

      - name: Commit generated pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SkyBit-ResourcePack-v3.2.0-READY.zip SkyBit-ResourcePack-v3.2.0.sha1.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build SkyBit Resource Pack v3.2.0'
            git push
          fi
