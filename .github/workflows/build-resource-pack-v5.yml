name: Build SkyBit Ultimate Resource Pack v5

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-resource-pack-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pillow pyyaml

      - name: Restore production generator
        run: |
          cat .build/skybit-v5/generator.*.b64 > /tmp/skybit-v5-generator.b64
          python - <<'PY'
          from pathlib import Path
          import base64, bz2
          encoded = Path('/tmp/skybit-v5-generator.b64').read_text().strip()
          source = bz2.decompress(base64.b64decode(encoded))
          Path('tools/generate_ultimate50.py').write_bytes(source)
          print('Generator restored:', len(source), 'bytes')
          PY
          python -m py_compile tools/generate_ultimate50.py

      - name: Generate and validate Minecraft 26.2 pack
        env:
          SKYBIT_BUILD_ROOT: build-v5
        run: python tools/generate_ultimate50.py

      - name: Publish generated pack and development files
        run: |
          rm -rf development/v5.0.0
          mkdir -p development/v5.0.0/tools
          cp -a build-v5/development/. development/v5.0.0/
          cp tools/generate_ultimate50.py development/v5.0.0/tools/generate_ultimate50.py
          cp build-v5/SkyBitResourcePack-v5.0.0-26.2-READY.zip ./SkyBitResourcePack-v5.0.0-26.2-READY.zip
          cp build-v5/SkyBitResourcePack.zip ./SkyBitResourcePack.zip
          cp build-v5/SkyBitResourcePack-v5.0.0-26.2.sha1.txt ./SkyBitResourcePack-v5.0.0-26.2.sha1.txt
          cp build-v5/release-manifest.json ./release-manifest-v5.0.0.json
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('development/v5.0.0')
          out=Path('SkyBitResourcePack-v5.0.0-development.zip')
          if out.exists(): out.unlink()
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file(): z.write(f,f.relative_to(root).as_posix())
              z.write('release-manifest-v5.0.0.json','release-manifest.json')
          PY

      - name: Independent release verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          p=Path('SkyBitResourcePack-v5.0.0-26.2-READY.zip')
          expected=Path('SkyBitResourcePack-v5.0.0-26.2.sha1.txt').read_text().strip()
          actual=hashlib.sha1(p.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              meta=json.loads(z.read('pack.mcmeta'))['pack']
              assert meta['min_format'] == [88,0]
              assert meta['max_format'] == [88,0]
              itemdefs=[n for n in z.namelist() if n.startswith('assets/skybit/items/') and n.endswith('.json')]
              assert len(itemdefs) == 92, len(itemdefs)
              assert 'assets/skybit/items/keys/mythic.json' in itemdefs
              assert 'assets/skybit/items/gear/weapons/void_reaver.json' in itemdefs
              assert 'assets/skybit/equipment/stormguard.json' in z.namelist()
          print('Release verified')
          print('SHA1:', actual)
          print('Item definitions:', len(itemdefs))
          PY

      - name: Commit generated v5 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_ultimate50.py development/v5.0.0 \
            SkyBitResourcePack-v5.0.0-26.2-READY.zip SkyBitResourcePack.zip \
            SkyBitResourcePack-v5.0.0-26.2.sha1.txt SkyBitResourcePack-v5.0.0-development.zip \
            release-manifest-v5.0.0.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build SkyBit Ultimate Resource Pack v5.0.0 for Minecraft 26.2'
            git push
          fi
